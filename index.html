<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destructive Typography Lab</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .workspace {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin: 40px 0;
        }

        .text-container {
            display: flex;
            gap: 4px;
            font-size: 5rem;
            font-weight: 900;
            text-transform: uppercase;
            flex-wrap: wrap;
            justify-content: center;
        }

        .letter-wrapper {
            display: inline-block;
            position: relative;
            transition: transform 0.1s ease;
        }

        .controls-panel {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            padding-bottom: 40px;
        }

        .letter-control-group {
            background: rgba(25, 25, 25, 0.6);
            border-radius: 8px;
            padding: 15px;
            backdrop-filter: blur(5px);
        }

        .letter-control-group h3 {
            margin-top: 0;
            margin-bottom: 12px;
            color: #ff3333;
            font-size: 1.2rem;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        .control-item {
            margin-bottom: 10px;
        }

        .control-item label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: #ccc;
        }

        .control-item input[type="range"] {
            width: 100%;
            accent-color: #ff3333;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="workspace">
        <div class="text-container" id="textContainer">
            <!-- Huruf akan digenerate secara dinamis oleh JavaScript -->
        </div>
    </div>

    <div class="controls-panel" id="controlsPanel">
        <!-- Panel kontrol per huruf akan digenerate di sini -->
    </div>

    <script>
        const word = "DECAY";
        const textContainer = document.getElementById('textContainer');
        const controlsPanel = document.getElementById('controlsPanel');

        // Struktur data untuk menyimpan nilai efek tiap huruf
        const letterStates = {};

        // Inisialisasi elemen huruf dan kontrol slider
        word.split('').forEach((char, index) => {
            const letterKey = `letter_${index}`;
            letterStates[letterKey] = {
                melt: 0,
                glitch: 0,
                stretch: 1,
                rotate: 0,
                scatter: 0
            };

            // 1. Buat elemen huruf di layar
            const span = document.createElement('span');
            span.className = 'letter-wrapper';
            span.textContent = char === ' ' ? '\u00A0' : char;
            span.id = `view_${letterKey}`;
            textContainer.appendChild(span);

            // 2. Buat panel kontrol untuk huruf ini (tanpa kotak pembatas abu-abu solid/clean style)
            const group = document.createElement('div');
            group.className = 'letter-control-group';
            group.innerHTML = `
                <h3>Letter: '${char}'</h3>
                <div class="control-item">
                    <label><span>Melt</span><span id="val_melt_${index}">0</span></label>
                    <input type="range" min="0" max="100" value="0" data-letter="${letterKey}" data-effect="melt">
                </div>
                <div class="control-item">
                    <label><span>Glitch</span><span id="val_glitch_${index}">0</span></label>
                    <input type="range" min="0" max="50" value="0" data-letter="${letterKey}" data-effect="glitch">
                </div>
                <div class="control-item">
                    <label><span>Stretch Y</span><span id="val_stretch_${index}">1.0</span></label>
                    <input type="range" min="1" max="3" step="0.1" value="1" data-letter="${letterKey}" data-effect="stretch">
                </div>
                <div class="control-item">
                    <label><span>Rotate Chaos</span><span id="val_rotate_${index}">0°</span></label>
                    <input type="range" min="-180" max="180" value="0" data-letter="${letterKey}" data-effect="rotate">
                </div>
                <div class="control-item">
                    <label><span>Scatter</span><span id="val_scatter_${index}">0</span></label>
                    <input type="range" min="0" max="80" value="0" data-letter="${letterKey}" data-effect="scatter">
                </div>
            `;
            controlsPanel.appendChild(group);
        });

        // Event listener untuk semua slider
        controlsPanel.addEventListener('input', (e) => {
            if (e.target.type === 'range') {
                const letterKey = e.target.dataset.letter;
                const effect = e.target.dataset.effect;
                const value = parseFloat(e.target.value);

                letterStates[letterKey][effect] = value;

                // Update label angka teks slider
                const index = word.split('').findIndex((_, i) => `letter_${i}` === letterKey);
                const valLabel = document.getElementById(`val_${effect}_${index}`);
                if (valLabel) {
                    valLabel.textContent = effect === 'rotate' ? value + '°' : (effect === 'stretch' ? value.toFixed(1) : value);
                }

                applyEffects(letterKey, index);
            }
        });

        // Fungsi merender efek destruktif ke huruf terkait
        function applyEffects(letterKey, index) {
            const state = letterStates[letterKey];
            const element = document.getElementById(`view_${letterKey}`);

            // Kalkulasi efek destruktif
            const meltY = state.melt * 2.5; 
            const meltSkew = state.melt * 0.4;
            const glitchX = (Math.random() - 0.5) * state.glitch;
            const glitchY = (Math.random() - 0.5) * state.glitch;
            const scatterX = (Math.sin(index * 99) * state.scatter);
            const scatterY = (Math.cos(index * 33) * state.scatter);

            // Terapkan transformasi CSS yang menarik/meleleh nyata dan destruktif
            element.style.transform = `
                translate(${glitchX + scatterX}px, ${glitchY + scatterY + meltY}px) 
                scaleY(${state.stretch + (state.melt / 30)}) 
                skewX(${meltSkew}deg) 
                rotate(${state.rotate}deg)
            `;
            
            // Efek visual tambahan pada elemen saat meleleh/tertarik
            if (state.melt > 0) {
                element.style.filter = `blur(${state.melt / 25}px)`;
                element.style.opacity = Math.max(0.3, 1 - (state.melt / 150));
            } else {
                element.style.filter = 'none';
                element.style.opacity = '1';
            }
        }
    </script>
</body>
</html>
