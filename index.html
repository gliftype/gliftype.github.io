<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single Letter Destruction Lab</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Input area untuk mengetik 1 huruf */
        .input-area {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-area input {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 16px;
            font-size: 1.2rem;
            border-radius: 6px;
            text-align: center;
            width: 60px;
            outline: none;
            text-transform: uppercase;
        }

        .input-area input:focus {
            border-color: #ff3333;
        }

        /* Workspace huruf tunggal */
        .workspace {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin: 20px 0;
        }

        .single-letter {
            font-size: 14rem;
            font-weight: 900;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
            user-select: none;
            transition: transform 0.05s ease;
        }

        /* Panel kontrol destruktif tanpa kotak pembatas abu-abu */
        .controls-panel {
            width: 100%;
            max-width: 700px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding-bottom: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-item {
            background: transparent;
        }

        .control-item label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: #aaa;
            letter-spacing: 0.5px;
        }

        .control-item input[type="range"] {
            width: 100%;
            accent-color: #ff3333;
            cursor: pointer;
            background: #222;
        }
    </style>
</head>
<body>

    <!-- Input untuk mengetik satu huruf -->
    <div class="input-area">
        <input type="text" id="letterInput" maxlength="1" value="A">
    </div>

    <!-- Area tampilan huruf tunggal yang destruktif -->
    <div class="workspace">
        <div class="single-letter" id="targetLetter">A</div>
    </div>

    <!-- Panel Slider Pengendali Destruktif (Bahasa Inggris & Tanpa Kotak Pembatas) -->
    <div class="controls-panel">
        <div class="control-group">
            <div class="control-item">
                <label><span>Melt (Vertical Pull)</span><span id="val_melt">0</span></label>
                <input type="range" id="rangeMelt" min="0" max="100" value="0">
            </div>
            <div class="control-item">
                <label><span>Glitch Intensity</span><span id="val_glitch">0</span></label>
                <input type="range" id="rangeGlitch" min="0" max="50" value="0">
            </div>
            <div class="control-item">
                <label><span>Stretch Vertical</span><span id="val_stretch">1.0</span></label>
                <input type="range" id="rangeStretch" min="1" max="4" step="0.1" value="1">
            </div>
        </div>

        <div class="control-group">
            <div class="control-item">
                <label><span>Rotation Chaos</span><span id="val_rotate">0°</span></label>
                <input type="range" id="rangeRotate" min="-180" max="180" value="0">
            </div>
            <div class="control-item">
                <label><span>Scatter / Disperse</span><span id="val_scatter">0</span></label>
                <input type="range" id="rangeScatter" min="0" max="100" value="0">
            </div>
            <div class="control-item">
                <label><span>Liquify Shear / Skew</span><span id="val_skew">0°</span></label>
                <input type="range" id="rangeSkew" min="-60" max="60" value="0">
            </div>
        </div>
    </div>

    <script>
        const letterInput = document.getElementById('letterInput');
        const targetLetter = document.getElementById('targetLetter');

        // Slider Elements
        const rangeMelt = document.getElementById('rangeMelt');
        const rangeGlitch = document.getElementById('rangeGlitch');
        const rangeStretch = document.getElementById('rangeStretch');
        const rangeRotate = document.getElementById('rangeRotate');
        const rangeScatter = document.getElementById('rangeScatter');
        const rangeSkew = document.getElementById('rangeSkew');

        // Value Label Elements
        const valMelt = document.getElementById('val_melt');
        const valGlitch = document.getElementById('val_glitch');
        const valStretch = document.getElementById('val_stretch');
        const valRotate = document.getElementById('val_rotate');
        const valScatter = document.getElementById('val_scatter');
        const valSkew = document.getElementById('val_skew');

        // Update huruf saat diketik
        letterInput.addEventListener('input', (e) => {
            const val = e.target.value.trim();
            if (val.length > 0) {
                targetLetter.textContent = val.charAt(0).toUpperCase();
                e.target.value = val.charAt(0).toUpperCase();
            } else {
                targetLetter.textContent = 'A';
            }
        });

        // Fungsi utama kalkulasi efek destruktif
        function updateDestruction() {
            const melt = parseFloat(rangeMelt.value);
            const glitch = parseFloat(rangeGlitch.value);
            const stretch = parseFloat(rangeStretch.value);
            const rotate = parseFloat(rangeRotate.value);
            const scatter = parseFloat(rangeScatter.value);
            const skew = parseFloat(rangeSkew.value);

            // Update teks label angka slider
            valMelt.textContent = melt;
            valGlitch.textContent = glitch;
            valStretch.textContent = stretch.toFixed(1);
            valRotate.textContent = rotate + '°';
            valScatter.textContent = scatter;
            valSkew.textContent = skew + '°';

            // Kalkulasi matematis efek destruktif nyata
            const meltY = melt * 3.5; // Efek tertarik ke bawah secara ekstrem
            const randomGlitchX = (Math.random() - 0.5) * glitch * 1.5;
            const randomGlitchY = (Math.random() - 0.5) * glitch * 1.5;
            const scatterX = (Math.sin(scatter * 5) * scatter * 1.2);
            const scatterY = (Math.cos(scatter * 3) * scatter * 1.2);

            // Terapkan transformasi CSS mutakhir pada huruf tunggal
            targetLetter.style.transform = `
                translate(${randomGlitchX + scatterX}px, ${randomGlitchY + scatterY + meltY}px)
                scaleY(${stretch + (melt / 25)})
                skew(${skew + (melt * 0.3)}deg, 0deg)
                rotate(${rotate}deg)
            `;

            // Efek visual tambahan (blur meleleh dan pemudaran/distorsi warna)
            if (melt > 0 || glitch > 0) {
                targetLetter.style.filter = `blur(${melt / 30}px) hue-rotate(${glitch * 3}deg)`;
            } else {
                targetLetter.style.filter = 'none';
            }
        }

        // Pasang event listener ke semua slider
        [rangeMelt, rangeGlitch, rangeStretch, rangeRotate, rangeScatter, rangeSkew].forEach(slider => {
            slider.addEventListener('input', updateDestruction);
        });
    </script>
</body>
</html>
